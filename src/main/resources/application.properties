spring.application.name=codetickets

# configuracao para conexao com banco de dados
spring.datasource.url=jdbc:postgresql://localhost:5432/codetickets_db
spring.datasource.jdbcUrl=jdbc:postgresql://localhost:5432/codetickets_db
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


# configuracao para inicializar tabelas de registro de execucao dos jobs
# (Spring Boot 4 / Spring Batch 6 removeram spring.batch.initialize-schema;
# o schema agora e criado via schema.sql com o mecanismo generico do Spring Boot)
spring.sql.init.mode=always

# configuracao para atualizar banco de dados com as alteracoes de entidades
spring.jpa.hibernate.ddl-auto=update

# pastas de controle do arquivo de importacao
importacao.pasta.recebidos=${IMPORTACAO_PASTA_RECEBIDOS:files/recebidos}
importacao.pasta.processados=${IMPORTACAO_PASTA_PROCESSADOS:files/processados}
importacao.pasta.erro=${IMPORTACAO_PASTA_ERRO:files/erro}

# intervalo (ms) da varredura da pasta de recebidos em busca de arquivos pendentes
# (deve seguir o padrao tickets_ddMMyy.csv)
importacao.polling.intervalMs=${IMPORTACAO_POLLING_INTERVAL_MS:60000}

# o job e disparado pelo ImportacaoPastaScanner (varredura da pasta), nao pelo
# auto-start padrao do Spring Boot no startup
spring.batch.job.enabled=false

